name: uptizm
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The magic ecosystem, resolved from pub.dev. A gitignored pubspec_overrides.yaml
  # points these at the local sibling checkouts for development; see that file and
  # `.claude/rules/flutter-app.md`. Declaring them hosted rather than by path is what
  # lets a worktree under .claude/worktrees/ analyze clean, because the analyzer reads
  # this file directly and warns on a `path:` that does not resolve from there.
  #
  # Caret on a 0.0.x package does NOT pin the patch in pub: `^0.0.9` means
  # `>=0.0.9 <0.1.0`, so a sibling's next patch is admitted without a bump here.
  #
  # EVERY VERSION BELOW IS ONE THAT EXISTS ON PUB.DEV. Raising a caret ahead of
  # the release is not a way to reserve it: the local build resolves through the
  # overrides, which REPLACE constraint checking, so the raise buys nothing here,
  # while hosted resolution fails outright and takes CI down on master itself.
  # That is not hypothetical: `^0.1.0` and `^0.0.1-alpha.27` were written here
  # ahead of both releases in #170, and every run since answered
  # `Because uptizm depends on magic_starter ^0.0.1-alpha.27 which doesn't match
  # any versions, version solving failed` before it reached a single test.
  #
  # A sibling change reaches production through the overrides and the local
  # build, not through a caret. These lines move AFTER the release is published,
  # and the AGENTS.md section "A pub.dev release is never on the critical path"
  # is the whole rule.
  magic: ^0.0.9
  magic_deeplink: ^0.0.3
  magic_notifications: ^0.2.0
  magic_payments: ^0.0.2
  magic_social_auth: ^0.0.3
  magic_starter: ^0.0.1-alpha.26

  # Dev-tooling, imported by lib/main.dart under kDebugMode (release tree-shakes).
  magic_devtools: ^0.0.4
  fluttersdk_dusk: ^0.0.13
  fluttersdk_telescope: ^0.0.5

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  fluttersdk_artisan: ^0.0.14

  # Error and performance reporting. Unlike magic_devtools above, this is NOT
  # dev-only: it is the release build's only way of telling anyone that
  # something broke, since the console it currently logs to belongs to the
  # visitor. It stays inert without a DSN, and `.env` only carries one in the
  # production build (see lib/config/sentry.dart).
  sentry_flutter: ^9.27.0
  sentry_dio: ^9.27.0

  # Charting for the uptizm dashboards.
  fl_chart: ^1.1.1


# No tracked dependency_overrides block. There used to be one pinning
# `file_picker: ^11.0.2`, and it is worth recording why it went rather than
# leaving the next person to rediscover it.
#
# It existed because magic once declared `>=11.0.2 <13.0.0`, which let the
# 12.0.0-beta prerelease resolve and break magic's own Pick facade. magic has
# since ported that facade to the file_picker 12 API and now declares
# `^12.2.0`, so the thing the pin protected against is gone and the pin itself
# became the hazard: an override does not narrow a constraint, it REPLACES
# constraint checking, so pub happily resolved file_picker 11 against a magic
# that needs 12. Nothing complained. `flutter pub get` succeeded, `flutter
# analyze` was clean (it does not analyse a path dependency's own source), and
# the mismatch only surfaced when a test compiled magic:
# `The method 'length' isn't defined for the type 'PlatformFile'`.
#
# So: do not reintroduce an override to hold a transitive dependency back. If a
# sibling needs a version this app cannot take, that is a conversation with the
# sibling, not a local pin that hides the disagreement until link time.

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Native icon and splash generators. Build-time only: neither ships in the
  # app, and both are run by hand (`bin/sync-icons` first, then the two
  # `dart run` invocations its output feeds) rather than on every build,
  # because both write directly into the tracked native projects and those
  # diffs want reading. See the `flutter_launcher_icons:` and
  # `flutter_native_splash:` blocks at the bottom of this file.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  assets:
    - assets/lang/en.json
    - assets/lang/tr.json
    # Runtime env (API_URL, BROADCAST_CONNECTION, REVERB_*). Must be bundled as
    # an asset so flutter_dotenv can load it on web; without this the app falls
    # back to Env defaults (BROADCAST_CONNECTION=null) and realtime never
    # connects. `.env` is gitignored, so CI/release builds must provision it
    # (it carries only public client config: the Reverb app key is public by
    # design, the app secret lives only in the backend .env).
    - .env
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Self-hosted Geist variable fonts (copied from the design source's
  # public/fonts/, NOT the Google Fonts build). Geist is the sans family;
  # Geist Mono carries metric/latency/timestamp columns.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/GeistVariable.woff2
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMonoVariable.woff2

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ------------------------------------------------------------------------------
# Native app icons.  dart run flutter_launcher_icons
#
# Every source below is written by `bin/sync-icons` from the one brand mark, so
# do not hand-edit anything under assets/brand/generated/; rerun that instead.
#
# WEB IS OFF, and that is the whole reason this block can exist safely. The four
# files under web/icons/ plus favicon.svg/png were cut by hand from the same mark
# and are optically corrected per size (the maskable pair is drawn smaller so it
# survives a launcher mask, the 16px favicon has a thicker ring). A generator
# would flatten all of that back to one mechanical downscale and would also
# rewrite web/manifest.json, which carries hand-written copy.
# ------------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/brand/generated/icon-app.png"

  ios: true
  # The source is already opaque RGB, so this changes nothing today. It stays as
  # the guard for tomorrow: App Store Connect rejects a marketing icon carrying
  # an alpha channel, and that rejection arrives after the upload, not before.
  remove_alpha_ios: true
  background_color_ios: "#008560"
  # iOS 18+ home-screen variants. Apple wants the dark one transparent so the
  # system composites it over its own material; the tinted one is the same art
  # desaturated, which for a white mark is a no-op and is the point.
  image_path_ios_dark_transparent: "assets/brand/generated/icon-ios-dark.png"
  image_path_ios_tinted_grayscale: "assets/brand/generated/icon-ios-dark.png"
  desaturate_tinted_to_grayscale_ios: true

  # `true` overwrites the existing ic_launcher rather than adding a second name,
  # so AndroidManifest.xml's android:icon keeps pointing at the same resource and
  # this generator never touches the manifest.
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#008560"
  adaptive_icon_foreground: "assets/brand/generated/icon-adaptive-foreground.png"
  # bin/sync-icons already drew the foreground at the safe-zone scale it measured
  # off the existing maskable web icon, so the tool's default 16% would stack a
  # second, unmeasured inset on top and shrink the mark to nothing.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/brand/generated/icon-monochrome.png"

  web:
    generate: false

# ------------------------------------------------------------------------------
# Native splash.  dart run flutter_native_splash:create
#
# WEB IS OFF here too, and for a stronger reason than above: web/index.html
# already draws this exact mark in pure CSS, animated, dark-mode aware and with a
# prefers-reduced-motion branch, precisely so the first paint costs no network
# round trip. It also carries the OneSignal SDK tag. This generator rewrites
# index.html in place.
#
# The android_12 block is not optional decoration. flutter_native_splash's own
# README: "These parameter do not affect the configuration of Android 12 and
# later". Omit it and every phone from Android 12 up ignores the colours above
# and shows the platform default instead, which is the silent half of this
# feature and the half that covers almost every live device.
# ------------------------------------------------------------------------------
flutter_native_splash:
  # DESIGN.md `surface`, the same two values web/index.html uses for its own
  # splash, so the handover between the two is invisible.
  color: "#F9FAFB"
  color_dark: "#07090C"
  image: assets/brand/generated/splash-mark.png
  image_dark: assets/brand/generated/splash-mark-dark.png

  android_12:
    color: "#F9FAFB"
    color_dark: "#07090C"
    # A separate, larger rendition rather than the one above: Android 12+ draws
    # the icon into a masked circle and clips the outer third, so the art has to
    # sit on a 1152px canvas inside a 768px circle. Handing it the 512px splash
    # mark would crop the ring.
    image: assets/brand/generated/splash-android12.png
    image_dark: assets/brand/generated/splash-android12-dark.png

  web: false
