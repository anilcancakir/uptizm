name: uptizm
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The magic ecosystem, resolved from pub.dev. A gitignored pubspec_overrides.yaml
  # points these at the local sibling checkouts for development; see that file and
  # `.claude/rules/flutter-app.md`. Declaring them hosted rather than by path is what
  # lets a worktree under .claude/worktrees/ analyze clean, because the analyzer reads
  # this file directly and warns on a `path:` that does not resolve from there.
  #
  # Caret on a 0.0.x package does NOT pin the patch in pub: `^0.0.9` means
  # `>=0.0.9 <0.1.0`, so a sibling's next patch is admitted without a bump here.
  magic: ^0.0.9
  magic_deeplink: ^0.0.3
  magic_notifications: ^0.2.0
  magic_payments: ^0.0.2
  magic_social_auth: ^0.0.3
  magic_starter: ^0.0.1-alpha.26

  # Dev-tooling, imported by lib/main.dart under kDebugMode (release tree-shakes).
  magic_devtools: ^0.0.4
  fluttersdk_dusk: ^0.0.13
  fluttersdk_telescope: ^0.0.5

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  fluttersdk_artisan: ^0.0.14

  # Error and performance reporting. Unlike magic_devtools above, this is NOT
  # dev-only: it is the release build's only way of telling anyone that
  # something broke, since the console it currently logs to belongs to the
  # visitor. It stays inert without a DSN, and `.env` only carries one in the
  # production build (see lib/config/sentry.dart).
  sentry_flutter: ^9.27.0
  sentry_dio: ^9.27.0

  # Charting for the uptizm dashboards.
  fl_chart: ^1.1.1


# No tracked dependency_overrides block. There used to be one pinning
# `file_picker: ^11.0.2`, and it is worth recording why it went rather than
# leaving the next person to rediscover it.
#
# It existed because magic once declared `>=11.0.2 <13.0.0`, which let the
# 12.0.0-beta prerelease resolve and break magic's own Pick facade. magic has
# since ported that facade to the file_picker 12 API and now declares
# `^12.2.0`, so the thing the pin protected against is gone and the pin itself
# became the hazard: an override does not narrow a constraint, it REPLACES
# constraint checking, so pub happily resolved file_picker 11 against a magic
# that needs 12. Nothing complained. `flutter pub get` succeeded, `flutter
# analyze` was clean (it does not analyse a path dependency's own source), and
# the mismatch only surfaced when a test compiled magic:
# `The method 'length' isn't defined for the type 'PlatformFile'`.
#
# So: do not reintroduce an override to hold a transitive dependency back. If a
# sibling needs a version this app cannot take, that is a conversation with the
# sibling, not a local pin that hides the disagreement until link time.

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  assets:
    - assets/lang/en.json
    - assets/lang/tr.json
    # Runtime env (API_URL, BROADCAST_CONNECTION, REVERB_*). Must be bundled as
    # an asset so flutter_dotenv can load it on web; without this the app falls
    # back to Env defaults (BROADCAST_CONNECTION=null) and realtime never
    # connects. `.env` is gitignored, so CI/release builds must provision it
    # (it carries only public client config: the Reverb app key is public by
    # design, the app secret lives only in the backend .env).
    - .env
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Self-hosted Geist variable fonts (copied from the design source's
  # public/fonts/, NOT the Google Fonts build). Geist is the sans family;
  # Geist Mono carries metric/latency/timestamp columns.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/GeistVariable.woff2
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMonoVariable.woff2

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
