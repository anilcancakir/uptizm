name: CI

# The gate on every pull request. `bin/check` is the same thing locally; these
# jobs exist so a green claim is a measurement rather than a report.
#
# The Flutter job resolves the twelve fluttersdk siblings from pub.dev, because
# `pubspec.yaml` pins them as hosted carets and only a gitignored
# `pubspec_overrides.yaml` points at the local working trees. That has one known
# and legitimate red: when a change here depends on a sibling API that is not
# PUBLISHED yet, the analyze step fails with "undefined". The fix is to release the
# sibling and bump the caret, not to change this app.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Hand-runnable on any ref. Added because GitHub silently failed to dispatch
  # this workflow for one pull request across three separate events (opened, a
  # later synchronize, and a close/reopen) while the workflow was active, the
  # repository public and Actions enabled, and while the same workflow ran
  # normally for the two pull requests before it. When that happens the branch
  # protection sits on "Expected, waiting for status to be reported" forever and
  # there is otherwise no way to produce the evidence the gate is asking for.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only for pull requests: cancelling a master run would leave that commit with no
  # green record at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  instructions:
    name: Instruction mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: CLAUDE.md is a symlink to AGENTS.md
        run: |
          if [ ! -L CLAUDE.md ] || [ "$(readlink CLAUDE.md)" != "AGENTS.md" ]; then
            echo "CLAUDE.md must be a symlink to AGENTS.md so both tools read one file." >&2
            exit 1
          fi
      - name: .github mirrors are current
        run: bin/sync-instructions --check

      # The siblings are not in this checkout, so the script falls back to verifying each copy
      # against the sha256 it recorded. That catches a hand-edit here and says plainly that
      # upstream freshness was not checked; only a local run with the working trees can do that.
      - name: Package skill copies are unedited
        run: bin/sync-skills --check

      # Pure Python over lib/, so it needs no Flutter toolchain and belongs here rather than in
      # the Flutter job. `bin/check` runs the same assertion locally.
      - name: Component registry is current
        run: bin/sync-registry --check

      # Also pure Python, but it shells out to rsvg-convert and needs Pillow, so unlike the three
      # above it cannot run on a bare runner.
      - name: Icon toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          python3 -m pip install --quiet --disable-pip-version-check Pillow

      # Native icons are generated from one svg and none of the other jobs looks at them, so
      # without this a hand-cut PNG, a stale brand after the mark moves, or a pbxproj carrying
      # the build setting flutter_launcher_icons corrupts all merge green. `--check` renders into
      # a temp directory and compares, so it cannot alter the tree it is measuring.
      #
      # It compares BYTES against a rasteriser this runner supplies, so a librsvg or Pillow major
      # bump here can fail an untouched tree. That is the intended trade: a false red names the
      # toolchain in its own diff, where a pixel-tolerant compare would quietly admit a real
      # change to the mark.
      - name: Native icons are current
        run: bin/sync-icons --check

      # Back to a bare runner: pure Python, no plutil, no Xcode. iOS signs Debug and Profile
      # against one entitlements file and Release against another, because a development
      # provisioning profile and a distribution one allow opposite aps-environment values. The
      # drift that split invites is invisible to every other job here and to a device test, since
      # a capability added through Xcode lands on the selected configuration only. Nothing else in
      # CI opens the iOS project at all.
      - name: iOS entitlements are in step
        run: python3 bin/ios-entitlements-check.py

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The twelve siblings used to be cloned next to this checkout, because
      # `pubspec.yaml` pointed at `../<pkg>`. It declares hosted carets now, so this
      # job resolves them from pub.dev and measures what an adopter actually gets.
      #
      # The consequence is the point rather than a cost: work that depends on
      # unreleased sibling code is green locally (a gitignored pubspec_overrides.yaml
      # points at the working trees) and RED here, naming the undefined symbol. Publish
      # the sibling and bump the caret; do not reshape this app around it.
      - name: Check out uptizm
        uses: actions/checkout@v7
        with:
          path: uptizm

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # `.env` is gitignored but has to exist: it is a bundled pubspec asset, and
      # flutter_dotenv throws at boot without it.
      - name: Seed the environment file
        working-directory: uptizm
        run: cp .env.example .env

      - name: Resolve dependencies
        working-directory: uptizm
        run: flutter pub get

      - name: Analyze
        working-directory: uptizm
        run: flutter analyze

      - name: Test
        working-directory: uptizm
        run: flutter test --concurrency=4

  # PHP 8.5 rather than the ^8.3 that composer.json declares. That constraint is
  # stale: the committed lock resolves symfony 8.1, which requires php >=8.4.1, so
  # `composer install` on 8.3 dies in a wall of "Problem N" lines that read like a
  # corrupt lock and are really a platform mismatch. 8.5 is also what the server
  # runs, so CI measures the same engine production does.
  backend-sqlite:
    name: Backend (pint + tests, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3, redis, bcmath, intl, zip, gd
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate
      # The probe classifier's behaviour is libcurl-version-dependent, and the code
      # documents measuring it through PHP rather than the curl CLI, which is a
      # different build. Printing it here makes that triage one glance instead of a
      # round trip.
      - name: Report the libcurl build
        run: |
          php -r 'echo "libcurl ".curl_version()["version"].PHP_EOL;'
      # The marketing and status views call @vite, which throws when the manifest is
      # absent, and public/build is gitignored. Without this step every page test
      # fails with a Vite error that looks nothing like the feature under test.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build assets
        run: npm ci && npm run build
      - name: Pint
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test --parallel --processes=4

  backend-postgres:
    name: Backend (tests, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    # Production is PostgreSQL and the suite's default SQLite has hidden two real
    # defects: `insert or ignore` swallowing a unique violation that PostgreSQL
    # raises, and a session timezone shifting every timestamptz write. This job is
    # the one that would have caught both.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: uptizm_test
          POSTGRES_USER: uptizm
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: uptizm_test
      DB_USERNAME: uptizm
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, zip, gd
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate
      # The probe classifier's behaviour is libcurl-version-dependent, and the code
      # documents measuring it through PHP rather than the curl CLI, which is a
      # different build. Printing it here makes that triage one glance instead of a
      # round trip.
      - name: Report the libcurl build
        run: |
          php -r 'echo "libcurl ".curl_version()["version"].PHP_EOL;'
      # The marketing and status views call @vite, which throws when the manifest is
      # absent, and public/build is gitignored. Without this step every page test
      # fails with a Vite error that looks nothing like the feature under test.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build assets
        run: npm ci && npm run build
      - name: Tests
        run: php artisan test

  # This job now also runs `npm test`, but its name stays "Regional checker
  # (typecheck)": that exact string is one of the five contexts branch
  # protection requires on master, so renaming it would drop the check from
  # every open PR until someone updates branch protection to match. Whoever
  # does that rename should do it in the same change.
  worker:
    name: Regional checker (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/workers/regional-checker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # New job, new name: it is not one of the five required contexts yet, so a
  # red run cannot block a merge. `bin/check`/`bin/check --fast` gate it
  # locally in the meantime; add it to branch protection once it has been
  # green on master once, which is deliberately the order and not an oversight.
  design-tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Scan for raw color literals
        run: bin/design-tokens
