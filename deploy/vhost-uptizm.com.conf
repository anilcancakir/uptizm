# CloudPanel vhost for the `uptizm.com` site.
#
# HOW TO APPLY: CloudPanel > Sites > uptizm.com > Vhost, replace everything with
# this file, Save. Never edit /etc/nginx/sites-enabled/*.conf directly; CloudPanel
# regenerates those from this template on save.
#
# This follows the same shape as the fluttersdk.com and kodizm.com vhosts on this
# box: CloudPanel's generated template, the `$connection_upgrade` map at the top,
# and an Octane proxy_pass in `location /`. Six changes, nothing else:
#
#   1. server_name gains `api.uptizm.com` and `*.uptizm.com`.
#   2. Octane is on 9502 (8000 is kodizm, 9501 is fluttersdk).
#   3. `X-Forwarded-For` carries `$http_cf_connecting_ip` instead of
#      `$proxy_add_x_forwarded_for`. See the note on that line.
#   4. `X-Forwarded-Proto` is added, because signed URLs need it.
#   5. A Reverb websocket location, borrowed verbatim from kodizm.com's vhost.
#   6. The `listen 8080` PHP-FPM server block is REMOVED. With Octane there is no
#      FPM path, and that block is a second entry into the same application: it
#      carries no settings placeholder, so no Cloudflare-only allowlist, and
#      hardcodes `HTTPS "on"` with `SERVER_PORT 443`. Only the firewall keeps it
#      unreachable, and nothing needs it.
#
# NOTE FOR ANYONE EDITING THIS FILE: never write a CloudPanel placeholder inside
# a comment. The panel substitutes them everywhere, comments included, so the
# expansion lands mid-sentence. Worse, an expansion that spans several lines would
# put its later lines outside the comment as live directives. Refer to them by
# name instead, as the line above does.
#
# There is deliberately NO location for Reverb's `/apps/{id}/events` publish API.
# Laravel owns no `apps` route, so it falls through to Octane and 404s on its own.
# This app publishes over the loopback (REVERB_HOST=127.0.0.1) and never needs it
# reachable.
#
# There is deliberately NO block for `/horizon` either. The dashboard is already
# closed by the app: `HorizonServiceProvider::gate()` holds an empty email
# allowlist, so it answers 403 to everyone. Opening it means adding an address to
# that array, which is a decision that belongs in git rather than in nginx.
#
# PREREQUISITE: Site Root must be `uptizm.com/backend/public`. This is a monorepo,
# so Laravel's public directory is one level deeper than CloudPanel's default, and
# the root placeholder below renders whatever that setting says.
#
# ONE SITE, FOUR HOSTNAMES, all the same Laravel application on one Octane
# instance rather than a second one costing ~300 MB on an 8 GB box:
#
#   uptizm.com          landing page + path-addressed status pages (/s/{slug})
#   *.uptizm.com        subdomain-addressed status pages ({slug}.uptizm.com)
#   api.uptizm.com      the JSON API and the websocket
#   www.uptizm.com      301 to the apex
#
# `app.uptizm.com` is absent on purpose: it is a separate static site holding the
# compiled Flutter client. nginx prefers an exact server_name over a wildcard, so
# that site wins over `*.uptizm.com` on its own hostname.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.uptizm.com;
  return 301 https://uptizm.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name uptizm.com api.uptizm.com *.uptizm.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  # Profile photos and status-page logos are the only uploads.
  client_max_body_size 20M;

  # Reverb websocket: the Pusher-protocol `/app/{appKey}` only. The regex is
  # narrower than a plain `/app` prefix on purpose, so nothing else beginning with
  # those characters (including `/apps/...`) is captured here.
  location ~ "^/app/[A-Za-z0-9_-]{20,}$" {
    proxy_pass http://127.0.0.1:6002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  location / {
    proxy_pass http://127.0.0.1:9502;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Scheme $scheme;
    proxy_set_header SERVER_PORT $server_port;
    proxy_set_header REMOTE_ADDR $remote_addr;
    # Cloudflare's own header, not the appended chain. Cloudflare APPENDS the real
    # address to a client-supplied X-Forwarded-For rather than replacing it, so
    # `$proxy_add_x_forwarded_for` would put an attacker-controlled value first
    # and every IP-keyed limiter in this app would accept it: the
    # slug-enumeration cap on the public status page, the subscribe throttle, the
    # address recorded against a login. `CF-Connecting-IP` is always written by
    # Cloudflare itself, so overwriting XFF with it cannot be forged from
    # outside. When the header is absent the variable is empty, nginx omits the
    # header, and Laravel falls back to REMOTE_ADDR.
    #
    # This depends on the site's "Allow traffic from Cloudflare only" setting
    # staying ON, which is why that is a required step and not a preference: with
    # it off, a request straight to the origin address could supply its own
    # CF-Connecting-IP.
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    # Without this Laravel generates http:// URLs behind TLS termination and every
    # signed URL breaks, the status-page preview image among them.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map|mjs|webmanifest|json)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
  }

  location ~ /\.(ht|svn|git) {
    deny all;
  }

  if (-f $request_filename) {
    break;
  }
}
