# CloudPanel vhost for the `uptizm.com` site.
#
# HOW TO APPLY: CloudPanel > Sites > uptizm.com > Vhost, paste this whole file,
# Save. Never edit /etc/nginx/sites-enabled/*.conf directly; CloudPanel
# regenerates those on save and the change is lost.
#
# The `{{...}}` tokens are CloudPanel placeholders. Keep them: CloudPanel
# substitutes the certificate paths, the site root, the log paths, and the
# per-site settings block (which is where the Cloudflare-only IP allowlist and
# any basic auth land).
#
# PREREQUISITE: set Site Root to `uptizm.com/backend/public` in the site's
# Settings. This is a monorepo, so Laravel's public directory is one level deeper
# than CloudPanel's default. `{{root}}` renders whatever that setting says, so if
# the two disagree nginx will serve the wrong directory.
#
# ONE SITE, FOUR HOSTNAMES. All of them are the same Laravel application, which
# is why they share one vhost and one Octane instance rather than costing a
# second ~300 MB on an 8 GB box:
#
#   uptizm.com          landing page + path-addressed status pages (/s/{slug})
#   *.uptizm.com        subdomain-addressed status pages ({slug}.uptizm.com)
#   api.uptizm.com      the JSON API, the websocket, and Horizon
#   www.uptizm.com      301 to the apex (CloudPanel generates that block itself)
#
# `app.uptizm.com` is deliberately NOT here: it is a separate static site serving
# the compiled Flutter client. nginx prefers an exact server_name over a wildcard,
# so that site wins over `*.uptizm.com` on its own hostname.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name uptizm.com api.uptizm.com *.uptizm.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  # --- Real client address ---------------------------------------------------
  #
  # Cloudflare is the only ingress (the allowlist in {{settings}} denies everyone
  # else), and it puts the true client address in CF-Connecting-IP. Rewriting
  # $remote_addr from that header is what makes every IP-keyed rate limiter in
  # the application real: the slug-enumeration cap on the public status page, the
  # subscribe throttle, the preview-image throttle, and the session IP recorded
  # against a login.
  #
  # Cloudflare APPENDS the client address to a client-supplied X-Forwarded-For
  # rather than replacing it, so the leftmost XFF entry is attacker controlled.
  # That is why X-Forwarded-For below is SET to the rewritten address instead of
  # $proxy_add_x_forwarded_for, and why Laravel trusts only the loopback
  # (bootstrap/app.php). Appending here would hand a forged address straight
  # through to the limiters.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # Profile photos and status-page logos are the only uploads.
  client_max_body_size 20M;

  index index.php;

  # --- Reverb websocket ------------------------------------------------------
  #
  # The Pusher protocol splits into two paths on the same Reverb port:
  #   /app/{appKey}      the client websocket        PUBLIC
  #   /apps/{appId}/...  the server publish API      MUST NOT BE PUBLIC
  #
  # `location ^~ /app/` with the trailing slash is load-bearing. A bare
  # `location /app` is a prefix match that also captures `/apps/...`, which would
  # expose the publish API and let anyone broadcast to any channel. This app
  # publishes to Reverb over the loopback (REVERB_HOST=127.0.0.1), so the publish
  # path never needs to be reachable from outside at all.
  location ^~ /app/ {
    proxy_pass http://127.0.0.1:6002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Belt and braces for the publish API, in case the location above is ever
  # loosened. Returning 404 rather than 403 keeps its existence unconfirmed.
  location ^~ /apps {
    return 404;
  }

  # --- Horizon ---------------------------------------------------------------
  #
  # Horizon's own `viewHorizon` gate already refuses an unauthorised viewer (it
  # answers 403), so this is defence in depth rather than the only lock. Replace
  # the allowed address with your own before relying on it, or leave `deny all`
  # and reach the dashboard over an SSH tunnel.
  location ^~ /horizon {
    allow 127.0.0.1;
    deny all;

    proxy_pass http://127.0.0.1:9502;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- Static assets ---------------------------------------------------------
  #
  # Served straight off disk when the file exists, so the Vite build, favicons
  # and status-page images never cost a PHP worker. Anything missing falls
  # through to the application, which is what keeps Laravel's own routes (a
  # signed preview image, for instance) working under these extensions.
  location ~* ^.+\.(css|js|map|jpg|jpeg|gif|png|ico|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|wasm)$ {
    expires max;
    access_log off;
    add_header alt-svc 'h3=":443"; ma=86400';
    try_files $uri @octane;
  }

  # --- The application ------------------------------------------------------
  location / {
    try_files $uri @octane;
  }

  location @octane {
    proxy_pass http://127.0.0.1:9502;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # SET, not appended: see the real-ip note above.
    proxy_set_header X-Forwarded-For $remote_addr;
    # Without this Laravel generates http:// URLs behind TLS termination, which
    # breaks every signed URL (the status-page preview image is one).
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 60;
    proxy_send_timeout 120;
    proxy_read_timeout 120;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }
}
