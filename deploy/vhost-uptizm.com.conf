# CloudPanel vhost for the `uptizm.com` site.
#
# HOW TO APPLY: CloudPanel > Sites > uptizm.com > Vhost, replace everything with
# this file, Save. Never edit /etc/nginx/sites-enabled/*.conf directly;
# CloudPanel regenerates those from this template on save.
#
# This is CloudPanel's own generated template with four changes. Everything else,
# including every `{{placeholder}}`, is left exactly as the panel wrote it:
#
#   1. server_name gains `api.uptizm.com` and `*.uptizm.com`.
#   2. `{{varnish_proxy_pass}}` becomes an explicit proxy_pass to Octane on 9502.
#      That placeholder renders `http://127.0.0.1:8080`, which is the shared
#      PHP-FPM port; this app runs on FrankenPHP under supervisor instead.
#   3. Three new locations: the Reverb websocket, a refusal for Reverb's publish
#      API, and an IP-restricted Horizon.
#   4. The `listen 8080` PHP-FPM server block is REMOVED. With Octane there is no
#      FPM path, and that block is a second entry point into the same
#      application: it carries no `{{settings}}` (so no Cloudflare-only
#      allowlist) and hardcodes `HTTPS "on"` with `SERVER_PORT 443`. The firewall
#      is the only thing keeping it unreachable, and it serves no purpose here.
#
# PREREQUISITE: Site Root must be `uptizm.com/backend/public`. This is a monorepo,
# so Laravel's public directory is one level deeper than CloudPanel's default, and
# `{{root}}` renders whatever that setting says.
#
# ONE SITE, FOUR HOSTNAMES, all the same Laravel application sharing one Octane
# instance rather than costing a second ~300 MB on an 8 GB box:
#
#   uptizm.com          landing page + path-addressed status pages (/s/{slug})
#   *.uptizm.com        subdomain-addressed status pages ({slug}.uptizm.com)
#   api.uptizm.com      the JSON API, the websocket, Horizon
#   www.uptizm.com      301 to the apex (the first block, as CloudPanel wrote it)
#
# `app.uptizm.com` is deliberately absent: it is a separate static site serving
# the compiled Flutter client. nginx prefers an exact server_name over a
# wildcard, so that site wins over `*.uptizm.com` on its own hostname.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.uptizm.com;
  return 301 https://uptizm.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name uptizm.com api.uptizm.com *.uptizm.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  # --- Real client address ---------------------------------------------------
  #
  # Cloudflare is the only ingress (the allowlist in {{settings}} denies everyone
  # else) and it puts the true client address in CF-Connecting-IP. Rewriting
  # $remote_addr from that header is what makes every IP-keyed rate limiter in
  # the application real: the slug-enumeration cap on the public status page, the
  # subscribe throttle, the preview-image throttle, and the address recorded
  # against a login session.
  #
  # Cloudflare APPENDS the client address to a client-supplied X-Forwarded-For
  # rather than replacing it, so the leftmost XFF entry is attacker controlled.
  # That is why X-Forwarded-For below is SET to the rewritten address instead of
  # CloudPanel's $proxy_add_x_forwarded_for, and why Laravel trusts only the
  # loopback (bootstrap/app.php). Appending would hand a forged address straight
  # to the limiters.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # Profile photos and status-page logos are the only uploads.
  client_max_body_size 20M;

  # --- Reverb websocket ------------------------------------------------------
  #
  # The Pusher protocol splits into two paths on the same Reverb port:
  #   /app/{appKey}      the client websocket        PUBLIC
  #   /apps/{appId}/...  the server publish API      MUST NOT BE PUBLIC
  #
  # The trailing slash in `^~ /app/` is load-bearing. A bare `/app` prefix also
  # matches `/apps/...`, which would expose the publish API and let anyone
  # broadcast to any channel. This app publishes over the loopback
  # (REVERB_HOST=127.0.0.1), so that path never needs to be reachable at all.
  location ^~ /app/ {
    proxy_pass http://127.0.0.1:6002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }

  # Belt and braces for the publish API, in case the location above is ever
  # loosened. 404 rather than 403 keeps its existence unconfirmed.
  location ^~ /apps {
    return 404;
  }

  # --- Horizon ---------------------------------------------------------------
  #
  # Horizon's own `viewHorizon` gate already answers 403 to an unauthorised
  # viewer, so this is defence in depth rather than the only lock. Add your own
  # address to `allow`, or leave it as is and reach the dashboard through an SSH
  # tunnel (`ssh -L 9502:127.0.0.1:9502 personal`).
  location ^~ /horizon {
    allow 127.0.0.1;
    deny all;

    proxy_pass http://127.0.0.1:9502;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- The application -------------------------------------------------------
  location / {
    proxy_pass http://127.0.0.1:9502;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # SET, not appended: see the real-ip note above.
    proxy_set_header X-Forwarded-For $remote_addr;
    # Without this Laravel generates http:// URLs behind TLS termination, which
    # breaks every signed URL, the status-page preview image among them.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
  }

  # Static files are served off disk when they exist, so the Vite build and the
  # favicons never cost a PHP worker. The `try_files` fallback is the one
  # addition to CloudPanel's block: without it a missing file 404s here instead
  # of reaching a Laravel route that legitimately ends in one of these
  # extensions.
  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
    try_files $uri @octane;
  }

  location @octane {
    proxy_pass http://127.0.0.1:9502;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}
