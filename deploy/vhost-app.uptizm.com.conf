# CloudPanel vhost for the `app.uptizm.com` static site.
#
# HOW TO APPLY: CloudPanel > Sites > app.uptizm.com > Vhost, paste this whole
# file, Save. Never edit /etc/nginx/sites-enabled/*.conf directly.
#
# Serves the compiled Flutter web client from
# /home/uptizm-app/htdocs/app.uptizm.com. There is no PHP here and no Laravel:
# the client talks to https://api.uptizm.com/api/v1 over CORS with a bearer
# token, so this host is pure static hosting.
#
# nginx prefers an exact server_name over a wildcard, so this site wins over the
# `*.uptizm.com` entry on the uptizm.com vhost. `app` is also in the reserved
# slug list (config/status_pages.php), so no tenant can claim a status page that
# would try to shadow it.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name app.uptizm.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  index index.html;

  # --- Flutter's own files: never cache -------------------------------------
  #
  # These carry no content hash, so a cached copy pins the app at an old build
  # and a deploy appears to do nothing. `flutter_service_worker.js` is the worst
  # offender: a stale service worker keeps serving old assets from its own cache
  # even after everything else updates.
  location = /index.html                 { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /flutter_bootstrap.js       { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /flutter_service_worker.js  { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /flutter.js                 { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /main.dart.js               { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /version.json               { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /manifest.json              { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }

  # `.env` is bundled as a pubspec asset, which the app REQUIRES: without it
  # flutter_dotenv silently defaults BROADCAST_CONNECTION to null on web and
  # realtime never connects. It ships to every browser, so it holds only public
  # values (API URL, Reverb app key). Never cache it, or a config change needs a
  # hard refresh per visitor.
  location = /assets/.env                { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }

  # --- Hashed assets: cache hard --------------------------------------------
  location ~* ^.+\.(css|js|map|jpg|jpeg|gif|png|ico|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|wasm|json|bin|otf)$ {
    expires max;
    access_log off;
    add_header alt-svc 'h3=":443"; ma=86400';
  }

  # --- SPA fallback ----------------------------------------------------------
  #
  # Flutter owns its routes (/dashboard, /monitors/{id}, ...), so anything that
  # is not a real file becomes index.html and the client router takes over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
