# CloudPanel vhost for the `app.uptizm.com` static site.
#
# HOW TO APPLY: CloudPanel > Sites > app.uptizm.com > Vhost, replace everything
# with this file, Save.
#
# CloudPanel's generated static template with two additions and one removal:
#
#   1. ADDED: a `location /` SPA fallback. The generated template has none, so
#      `/dashboard` and `/monitors/{id}` would 404 even though the Flutter router
#      owns them.
#   2. ADDED: no-store on Flutter's own entry files, as exact-match locations so
#      they win over the long-cache regex. They carry no content hash, so a
#      cached copy pins the app at an old build and a deploy appears to do
#      nothing. `flutter_service_worker.js` is the worst of them: a stale service
#      worker keeps serving old assets out of its own cache after everything else
#      has updated.
#   3. REMOVED: `json` from the long-cache regex. Flutter's asset manifests
#      (`assets/AssetManifest.json` and friends) keep the same filenames across
#      builds, so `expires max` on them would pin an old manifest and new assets
#      would 404. Everything else in that list is either content-hashed or
#      genuinely immutable.
#
# Serves the compiled Flutter web client from
# /home/uptizm-app/htdocs/app.uptizm.com. No PHP and no Laravel here: the client
# talks to https://api.uptizm.com/api/v1 over CORS with a bearer token.
#
# nginx prefers an exact server_name over a wildcard, so this site wins over the
# `*.uptizm.com` entry on the uptizm.com vhost. `app` is also in the reserved slug
# list (config/status_pages.php), so no tenant can register a status page that
# would try to shadow it.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name app.uptizm.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  index index.html;

  # Flutter's own files: never cache.
  location = /index.html                { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /flutter_bootstrap.js      { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /flutter_service_worker.js { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /flutter.js                { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /main.dart.js              { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /version.json              { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /manifest.json             { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }

  # `.env` is bundled as a pubspec asset, which the app REQUIRES: without it
  # flutter_dotenv silently defaults BROADCAST_CONNECTION to null on web and
  # realtime never connects. It ships to every browser, so it holds only public
  # values (the API URL and the Reverb app key, which the Pusher protocol puts in
  # the client anyway). Uncached, or a config change needs a hard refresh per
  # visitor.
  location = /assets/.env               { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf|map|mjs|webmanifest|wasm)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
  }

  location ~ /\.(ht|svn|git) {
    deny all;
  }

  # SPA fallback: Flutter owns its routes, so anything that is not a real file
  # becomes index.html and the client router takes over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
