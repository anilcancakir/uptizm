name = "uptizm-regional-checker"
main = "src/index.ts"
compatibility_date = "2026-07-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# RELAY_SECRET is never declared here. In `wrangler dev` it is read from
# `.dev.vars` (git-ignored, provisioned out of band); in production it is
# uploaded with `wrangler secret put RELAY_SECRET`. Source reads it via
# `env.RELAY_SECRET`.

# One region-pinned Durable Object class runs the outbound probe. SQLite
# DOs run on the Free plan and in `wrangler dev`, so the migration uses
# `new_sqlite_classes`.
[[durable_objects.bindings]]
name = "RegionalProbe"
class_name = "RegionalProbe"

# This block describes a history Cloudflare has ALREADY applied, so it is a
# record, not a knob. Checked against the account on 2026-08-05: the deployed
# script reports `migration_tag = "v1"` and its namespace
# `uptizm-regional-checker_RegionalProbe` reports `use_sqlite = true`, both
# matching what is written below. Wrangler decides which migrations to apply by
# comparing the deployed tag against this list, so renaming the tag or moving
# the class between `new_classes` and `new_sqlite_classes` diverges from the
# recorded history and the next deploy either refuses or applies the wrong
# step, against a Durable Object that is carrying live probe traffic. The test
# pool reads this same block, so an edit here also changes what the suite
# proves.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RegionalProbe"]
