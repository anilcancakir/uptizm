<!--
  Uptizm status-page favicon: operational.

  Generated from assets/brand/uptizm-mark.svg with the fill swapped for the
  status colour. The colour is green-500,  the banner dot for a healthy page, taken from the same Tailwind step the
  banner dot uses, so the browser tab and the page can never disagree.

  Regenerate with backend/public/favicon/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Uptizm">
  <defs>
    <filter id="s" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#22c55e" flood-opacity="0.38"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#22c55e" stroke-opacity="0.20" stroke-width="5"/>
  <circle cx="32" cy="32" r="13" fill="#22c55e" filter="url(#s)"/>
</svg>
