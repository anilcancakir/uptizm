        - heading "How a check becomes a page" [level=2] [ref=e190]
        - paragraph [ref=e191]: Four steps, and a decision in the middle of them. Most alert fatigue comes from tools that skip step three.
      - list [ref=e192]:
        - listitem [ref=e193]:
          - generic [ref=e194]:
            - generic [ref=e195]: "1"
            - generic [ref=e196]: Probe
          - heading "Runs where your users are" [level=3] [ref=e197]
          - paragraph [ref=e198]: A signed check spec goes to a worker pinned to the region you picked. It issues the request from that geography and reports back the status, the timing and the data centre it ran in.
        - listitem [ref=e199]:
          - generic [ref=e200]:
            - generic [ref=e201]: "2"
            - generic [ref=e202]: Record
          - heading "Stores the evidence, per region" [level=3] [ref=e203]
          - paragraph [ref=e204]: Each result is written against the region it was requested for and the data centre it actually came from, so "checked from EU West" is something you can audit rather than a label we printed.
        - listitem [ref=e205]:
          - generic [ref=e206]:
            - generic [ref=e207]: "3"
            - generic [ref=e208]: Decide
          - heading "One bad check is not an incident" [level=3] [ref=e209]
          - paragraph [ref=e210]: A failure advances a counter. Nothing opens until it crosses the monitor's threshold, which defaults to two in a row and is yours to set. A breached metric bound can open one too.
        - listitem [ref=e211]:
          - generic [ref=e212]:
            - generic [ref=e213]: "4"
            - generic [ref=e214]: Page
          - heading "Walks your escalation policy" [level=3] [ref=e215]
          - paragraph [ref=e216]: The incident goes step by step to whoever is on call, over the destinations you configured. Each one is throttled, so a flapping monitor cannot turn into forty messages.
