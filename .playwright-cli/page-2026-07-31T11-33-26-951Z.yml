      - generic [ref=e277]:
        - generic [ref=e278]: Signal, not noise
        - heading "What it does when it does not know" [level=2] [ref=e280]
        - paragraph [ref=e281]: Any monitor can tell you a site is down. The harder question is what it reports when the answer is genuinely unclear, because that is where false pages and false confidence both come from.
      - generic [ref=e282]:
        - article [ref=e283]:
          - heading "A check we could not run is not an outage" [level=3] [ref=e284]:
            - img [ref=e285]
            - generic [ref=e288]: A check we could not run is not an outage
          - paragraph [ref=e289]: If the edge itself refuses to execute a probe, that measured nothing about your service. It is recorded as a configuration problem on the monitor, and nobody is paged. It does not count as a success either, because clearing the failure streak would hide a real outage underneath.
        - article [ref=e290]:
          - heading "A recovery only closes what it fixed" [level=3] [ref=e291]:
            - img [ref=e292]
            - generic [ref=e295]: A recovery only closes what it fixed
          - paragraph [ref=e296]: A healthy response resolves the "is it down" incident. It does not touch an incident opened by an expiring TLS certificate or a breached latency bound, because a reachable endpoint does not renew a certificate or make itself fast again.
        - article [ref=e297]:
          - heading "The same result twice changes nothing" [level=3] [ref=e298]:
            - img [ref=e299]
            - generic [ref=e302]: The same result twice changes nothing
          - paragraph [ref=e303]: "Delivery is at-least-once, so a probe result can arrive more than once. Each carries an id: a repeat writes no second row, advances no counter and opens no second incident."
        - article [ref=e304]:
          - heading "No data is a state, not a zero" [level=3] [ref=e305]:
            - img [ref=e306]
            - generic [ref=e309]: No data is a state, not a zero
          - paragraph [ref=e310]: A monitor with no checks yet shows no uptime figure, not 100% and not 0%. A day it was not being watched renders neutral on the history bar instead of green. An empty status page says so rather than claiming all systems are operational.
    - generic [ref=e312]:
      - generic [ref=e313]:
        - heading "What you get" [level=2] [ref=e314]
        - paragraph [ref=e315]: Enough to run an on-call rotation and keep customers informed, without a second tool for the status page.
      - generic [ref=e316]:
        - article [ref=e317]:
          - img [ref=e318]
          - heading "HTTP and TCP checks" [level=3] [ref=e320]
          - paragraph [ref=e321]: Pick the expected status code, send your own request headers and body, set the interval and the timeout per monitor. TCP monitors measure the connect and handshake.
        - article [ref=e322]:
          - img [ref=e323]
          - heading "Metrics out of the response" [level=3] [ref=e325]
          - paragraph [ref=e326]: Pull a number out of the body with JSONPath, XPath or a regex, or out of a response header, and give it warn and critical bounds. Breaching one opens an incident like any other failure.
        - article [ref=e327]:
          - img [ref=e328]
          - heading "Incidents with a timeline" [level=3] [ref=e330]
          - paragraph [ref=e331]: Acknowledge, assign, post updates, reopen, and write the postmortem in the same place. Severity and customer impact are recorded separately, because they are not the same question.
        - article [ref=e332]:
          - img [ref=e333]
          - heading "On-call and escalation" [level=3] [ref=e335]
          - paragraph [ref=e336]: Rotating schedules with overrides for the week someone is away, and escalation policies that walk ordered steps to a schedule or a named person until somebody acknowledges.
        - article [ref=e337]:
          - img [ref=e338]
          - heading "Status pages you control" [level=3] [ref=e340]
          - paragraph [ref=e341]: Publish only the components you choose, on a path or on a subdomain, each with its own public label. Private pages are gated by a token.
        - article [ref=e342]:
          - img [ref=e343]
          - heading "TLS expiry, watched daily" [level=3] [ref=e345]
          - paragraph [ref=e346]: Every HTTPS monitor has its certificate checked once a day and opens a warning incident inside the window you set, so a renewal you forgot does not become an outage.
      - paragraph [ref=e347]: Alerts reach your team over Slack, Webhook, PagerDuty and Microsoft Teams, and each responder can also take incidents in the app.
